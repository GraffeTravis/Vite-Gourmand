name: vite-gourmand
services:
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://vg:vg_local_only@postgres:5432/vite_gourmand
      MONGODB_URI: mongodb://vg:vg_local_only@mongo:27017/?authSource=admin
      MONGODB_DATABASE: vite_gourmand_analytics
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: Vite & Gourmand <bonjour@vite-gourmand.test>
      APP_URL: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      mailpit: { condition: service_started }
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vite_gourmand
      POSTGRES_USER: vg
      POSTGRES_PASSWORD: vg_local_only
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vg -d vite_gourmand"]
      interval: 5s
      timeout: 5s
      retries: 12
  mongo:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: vg
      MONGO_INITDB_ROOT_PASSWORD: vg_local_only
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "vg", "--password", "vg_local_only", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres_data:
  mongo_data:
